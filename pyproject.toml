[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knee-seg2fit"
version = "0.1.0"
description = "Knee OA Analysis & Implant Sizing Pipeline"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "monai>=1.3",
    "numpy>=1.24",
    "scipy>=1.11",
    "pandas>=2.1",
    "scikit-learn>=1.3",
    "matplotlib>=3.8",
    "streamlit>=1.28",
    "nibabel>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "black>=23.0",
    "ruff>=0.1",
]

[tool.black]
line-length = 88
